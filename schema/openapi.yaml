openapi: "3.0.0"
info:
  version: 1.0.0
  title: Tawk.to Simplotel Middleware API
  description: >
    Middleware Orchestrator API for integrating Tawk.to AI Assist with Simplotel Booking Engine.
    Provides session tracking, price calculations, and tax mapping.
  license:
    name: MIT
servers:
  - url: http://localhost:3000/api
    description: Local development middleware server
  - url: https://your-middleware-domain.com/api
    description: Production middleware server
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      summary: Health check
      description: Check the status of the middleware and Simplotel Booking Engine connection.
      operationId: getHealth
      responses:
        "200":
          description: Connection successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  hotel_id:
                    type: integer
                    example: 11184
                  user:
                    type: string
                    example: simpadmin

  /availability:
    post:
      summary: Check Room Availability
      description: Retrieve live room inventory, rate plans, and independent addons for selected dates.
      operationId: checkAvailability
      parameters:
        - in: header
          name: X-Session-ID
          schema:
            type: string
          required: false
          description: Session identifier to track booking progress.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - checkIn
                - checkOut
                - rooms
                - propertyId
                - sessionId
              properties:
                checkIn:
                  type: string
                  format: date
                  description: Check-in date (YYYY-MM-DD)
                  example: "2026-05-25"
                checkOut:
                  type: string
                  format: date
                  description: Check-out date (YYYY-MM-DD)
                  example: "2026-05-28"
                propertyId:
                  type: integer
                  description: Simplotel Hotel ID
                  example: 11184
                promocode:
                  type: string
                  description: Optional promo code to filter and apply discount
                  example: "SAVE10"
                sessionId:
                  type: string
                  description: REQUIRED. The unique conversation ID or chat ID. Must be passed consistently across all API calls to maintain booking state.
                  example: "chat_78910"
                rooms:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                      - adults
                      - children
                    properties:
                      id:
                        type: integer
                        description: Room number/index (1, 2, 3...)
                        example: 1
                      adults:
                        type: integer
                        minimum: 1
                        maximum: 4
                        example: 2
                      children:
                        type: integer
                        minimum: 0
                        maximum: 4
                        example: 1
                      childAge:
                        type: array
                        description: Array of child ages (0-17). Required if children > 0
                        items:
                          type: integer
                        example: [7]
      responses:
        "200":
          description: Availability response
          content:
            application/json:
              schema:
                type: object
                properties:
                  rooms:
                    type: array
                    items:
                      type: object
                      properties:
                        room_type:
                          type: integer
                          example: 96056
                        name:
                          type: string
                          example: Standard Rooms
                        availability:
                          type: integer
                          example: 20
                        rate_plans:
                          type: array
                          items:
                            type: object
                  total_room_availability:
                    type: integer
                    example: 20
                  independent_addons:
                    type: array
                    items:
                      type: object
                  sessionId:
                    type: string
                    example: "sess_123456"

  /book:
    post:
      summary: Confirm Booking
      description: Create a confirmed booking immediately on the Simplotel engine.
      operationId: createBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - checkIn
                - checkOut
                - propertyId
                - advanceAmount
                - holdInventory
                - quoteInfo
                - lineItems
                - sessionId
              properties:
                checkIn:
                  type: string
                  format: date
                  example: "2026-05-25"
                checkOut:
                  type: string
                  format: date
                  example: "2026-05-28"
                propertyId:
                  type: integer
                  example: 11184
                advanceAmount:
                  type: number
                  example: 0
                sessionId:
                  type: string
                  description: REQUIRED. The unique conversation ID or chat ID. Must be passed consistently across all API calls to maintain booking state.
                  example: "chat_78910"
                holdInventory:
                  type: object
                  required:
                    - enabled
                    - value
                    - unit
                  properties:
                    enabled:
                      type: boolean
                      example: true
                    value:
                      type: integer
                      example: 24
                    unit:
                      type: string
                      example: "HOURS"
                quoteInfo:
                  type: object
                  required:
                    - checkInDate
                    - checkOutDate
                    - customerDetail
                  properties:
                    checkInDate:
                      type: string
                      format: date
                      example: "2026-05-25"
                    checkOutDate:
                      type: string
                      format: date
                      example: "2026-05-28"
                    customerDetail:
                      type: object
                      required:
                        - name
                        - email
                        - phone
                      properties:
                        name:
                          type: string
                          example: "John Doe"
                        email:
                          type: string
                          format: email
                          example: "john@example.com"
                        phone:
                          type: string
                          example: "+919876543210"
                        bookingForSelf:
                          type: boolean
                          default: true
                    city:
                      type: string
                      example: "Mumbai"
                    state:
                      type: string
                      example: "Maharashtra"
                    country:
                      type: string
                      example: "India"
                    gstNumber:
                      type: string
                      example: ""
                lineItems:
                  type: array
                  items:
                    type: object
                independent_addons:
                  type: array
                  items:
                    type: object
      responses:
        "200":
          description: Booking confirmation details
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking_id:
                    type: string
                    example: "KMDXCM"
                  quote_id:
                    type: string
                    example: "QMHIFV"
                  sessionId:
                    type: string
                    example: "sess_123456"

  /send-invoice:
    post:
      summary: Send Invoice & Payment Link
      description: Create a booking invoice and generate a secure checkout link for upfront payments.
      operationId: sendInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - checkIn
                - checkOut
                - propertyId
                - advanceAmount
                - holdInventory
                - quoteInfo
                - lineItems
                - sessionId
              properties:
                checkIn:
                  type: string
                  format: date
                  example: "2026-05-25"
                checkOut:
                  type: string
                  format: date
                  example: "2026-05-28"
                propertyId:
                  type: integer
                  example: 11184
                advanceAmount:
                  type: number
                  example: 5000
                advancePercentage:
                  type: integer
                  example: 100
                sessionId:
                  type: string
                  description: REQUIRED. The unique conversation ID or chat ID. Must be passed consistently across all API calls to maintain booking state.
                  example: "chat_78910"
                holdInventory:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      example: true
                    value:
                      type: integer
                      example: 24
                    unit:
                      type: string
                      example: "HOURS"
                quoteInfo:
                  type: object
                lineItems:
                  type: array
                  items:
                    type: object
                independent_addons:
                  type: array
                  items:
                    type: object
      responses:
        "200":
          description: Invoice details and payment link
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking_id:
                    type: string
                    example: "KMDXCM"
                  quote_id:
                    type: string
                    example: "QMHIFV"
                  invoice_id:
                    type: integer
                    example: 12345
                  payment_link:
                    type: string
                    example: "https://checkout.simplotel.com/pay/12345"
                  sessionId:
                    type: string
                    example: "sess_123456"

  /send-quote:
    post:
      summary: Send Quote Email
      description: Send a quote email to the customer with checkout links.
      operationId: sendQuote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - check_in_date
                - check_out_date
                - room_selection
                - customer_detail
                - propertyId
                - sessionId
              properties:
                check_in_date:
                  type: string
                  format: date
                  example: "2026-05-25"
                check_out_date:
                  type: string
                  format: date
                  example: "2026-05-28"
                propertyId:
                  type: integer
                  example: 11184
                sessionId:
                  type: string
                  description: REQUIRED. The unique conversation ID or chat ID. Must be passed consistently across all API calls to maintain booking state.
                  example: "chat_78910"
                customer_detail:
                  type: object
                  required:
                    - name
                    - email
                    - phone
                  properties:
                    name:
                      type: string
                      example: "John Doe"
                    email:
                      type: string
                      format: email
                      example: "john@example.com"
                    phone:
                      type: string
                      example: "+919876543210"
                room_selection:
                  type: array
                  items:
                    type: object
                    required:
                      - room_type
                      - rate_plan_id
                      - adults
                      - children
                    properties:
                      room_type:
                        type: integer
                        example: 96056
                      rate_plan_id:
                        type: integer
                        example: 11976
                      adults:
                        type: integer
                        example: 2
                      children:
                        type: integer
                        example: 0
      responses:
        "200":
          description: Quote sending confirmation
          content:
            application/json:
              schema:
                type: object
                properties:
                  quote:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "NVUPX7"
                      status:
                        type: string
                        example: "PENDING"
                      expiry_time:
                        type: string
                        example: "2026-05-27T10:20:07Z"
                  base_booking_url:
                    type: string
                    example: "https://checkout.simplotel.com/quote/NVUPX7"
                  sessionId:
                    type: string
                    example: "sess_123456"

  /status/{action}:
    post:
      summary: Update Status
      description: Update or modify a booking or quote status (Confirm, Cancel, Edit, Extend).
      operationId: updateStatus
      parameters:
        - in: path
          name: action
          schema:
            type: string
            enum: [CONFIRMED, CANCELLED, EXTENDEXPIRY, EDIT]
          required: true
          description: Lifecycle action to apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  description: Quote ID or Booking ID to update
                  example: "NVUPX7"
                customer_detail:
                  type: object
                  properties:
                    name:
                      type: string
                    email:
                      type: string
                    phone:
                      type: string
                internal_comments:
                  type: string
                  example: "Updated via Tawk.to bot"
                guest_comments:
                  type: string
                extend_hold_duration:
                  type: object
                  properties:
                    value:
                      type: integer
                      example: 24
                    unit:
                      type: string
                      example: "HOURS"
                booking:
                  type: object
                  properties:
                    advance_amount:
                      type: number
                    booking_status:
                      type: string
                      example: "IN_PROGRESS"
                send_email:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Status change confirmation details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: "CANCELLED"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
