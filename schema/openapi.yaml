openapi: "3.0.0"
info:
  version: 2.0.0
  title: Tawk.to Simplotel Middleware API
  description: >
    Middleware API for integrating Tawk.to AI Assist with the Simplotel Booking Engine.

    IMPORTANT RULES FOR THE AI AGENT:
    - Always pass sessionId consistently across ALL calls in the same conversation.
    - Use the sessionId from the first API response and reuse it in every subsequent call.
    - When presenting room options to the guest, always use the option_number from the /availability response.
    - CRITICAL: When calling /book or /send-invoice, you MUST pass the real room_type_id (numeric) and rate_plan_id (string/numeric) exactly as returned by /availability. NEVER use placeholders like "room_type_id" or "rate_plan_id" in the final API call.
    - propertyId is always 11184. Never ask the guest for it.
    - Collect guest name, email, and phone before calling /book or /send-invoice.
    - After a successful booking or invoice, tell the guest to check their email for confirmation and payment details.

servers:
  - url: http://localhost:3000/api
    description: Local development server
security:
  - ApiKeyAuth: []

paths:
  /health:
    get:
      summary: Health Check
      description: Verify the middleware and Simplotel connection are working.
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  hotel_id:
                    type: integer
                    example: 11184
                  user:
                    type: string
                    example: simpadmin

  /availability:
    post:
      summary: Check Room Availability
      description: >
        Retrieve available rooms and rate plans for the requested dates and occupancy.
        Returns a flat `options[]` array. Each option has an `option_number`, a `room_type_id`,
        and a `rate_plan_id`. When the guest selects a room, pass the `room_type_id` and
        `rate_plan_id` from the chosen option into the lineItems of /book or /send-invoice.
        Do NOT use option_number as a room identifier in booking calls.

        For follow-up requests such as "more details" or "room description", the API
        also returns room detail fields like `room_description` and `detail_message`.
        These fields can be used by the AI assistant to answer guest queries accurately.
      operationId: checkAvailability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - checkIn
                - checkOut
                - rooms
                - sessionId
              properties:
                sessionId:
                  type: string
                  description: >
                    REQUIRED. The unique conversation/chat ID. Must be the same value
                    across all API calls in this conversation to maintain booking state.
                  example: "chat_abc123"
                checkIn:
                  type: string
                  format: date
                  description: Check-in date in YYYY-MM-DD format.
                  example: "2026-06-01"
                checkOut:
                  type: string
                  format: date
                  description: Check-out date in YYYY-MM-DD format.
                  example: "2026-06-05"
                propertyId:
                  type: integer
                  description: Simplotel Hotel ID. Always use 11184. Never ask the guest.
                  default: 11184
                  example: 11184
                promocode:
                  type: string
                  description: Optional promo/discount code entered by the guest.
                  example: "SAVE10"
                filters:
                  type: object
                  description: >
                    Optional Hard Filters to apply to results. These are post-processed
                    by the middleware to narrow down options based on guest preference.
                  properties:
                    mealPlan:
                      type: string
                      enum: [Breakfast, Half Board, Full Board, Room Only]
                      description: Filter by meal inclusion.
                    maxPrice:
                      type: number
                      description: Filter out options with pricePerNight above this value.
                    bedType:
                      type: string
                      enum: [King, Queen, Twin, Single]
                      description: Filter by bed configuration.
                    onlyRefundable:
                      type: boolean
                      description: If true, only show flexible/refundable rates.
                rooms:
                  type: array
                  description: One entry per room being booked with occupancy details.
                  items:
                    type: object
                    required:
                      - id
                      - adults
                      - children
                    properties:
                      id:
                        type: integer
                        description: Room index starting from 1.
                        example: 1
                      adults:
                        type: integer
                        minimum: 1
                        maximum: 4
                        description: Number of adults in this room.
                        example: 2
                      children:
                        type: integer
                        minimum: 0
                        maximum: 4
                        description: Number of children in this room.
                        example: 1
                      childAge:
                        type: array
                        description: >
                          Age of each child (0–17). Required when children > 0.
                          Array length must equal the children count.
                        items:
                          type: integer
                          minimum: 0
                          maximum: 17
                        example: [7]
      responses:
        "200":
          description: Available room options
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId:
                    type: string
                    description: Session ID to reuse in all subsequent calls.
                    example: "chat_abc123"
                  currency:
                    type: string
                    description: >
                      Currency symbol for all prices in this response.
                      Always use this symbol when displaying prices to the guest.
                    example: "₹"
                  rooms_required:
                    type: integer
                    description: Number of rooms needed for the requested occupancy.
                    example: 2
                  filters_relaxed:
                    type: boolean
                    description: >
                      If true, it means no rooms matched the specific guest preferences,
                      so the system returned all available rooms instead.
                      Tell the guest: "I couldn't find an exact match for your preferences,
                      but here are the best available options:"
                    example: false
                  options:
                    type: array
                    description: >
                      Flat sequential list of all available options.
                      
                      FORMATTING RULE: Present every option using this EXACT multi-line structure:
                      "Option [option_number]: [room_name]
                      Rate: [rate_plan_name]
                      Price: [currency][price_per_night_incl_taxes]/night
                      Total for [rooms_required] room(s): [currency][grand_total_all_rooms_incl_taxes]"

                      CLARITY FALLBACK: If the guest says "I don't understand" or asks for 
                      more details, provide the list again but include:
                      - "Includes: [inclusions]"
                      - "Cancellation: [cancellation_policy]"

                      After listing all options ask: "Which option number would you like?"
                    items:
                      type: object
                      properties:
                        option_number:
                          type: integer
                          description: >
                            Display number for presenting to the guest (1, 2, 3...).
                            Use this as the label when listing options to the guest.
                            Do NOT pass this value to /book or /send-invoice — use
                            room_type_id and rate_plan_id instead.
                          example: 1
                        room_name:
                          type: string
                          description: Human-readable room type name.
                          example: "Coral Azure (Garden Facing)"
                        rate_plan_name:
                          type: string
                          description: Human-readable rate plan name.
                          example: "Room with Breakfast"
                        room_description:
                          type: string
                          description: Detailed room description to help guests understand the offer.
                          example: "Elegant ocean-view room with king bed, Wi-Fi, and breakfast included."
                        max_occupancy:
                          type: integer
                          description: >
                            Maximum number of guests this room can accommodate.
                            Use this to understand room capacity and inform guests about room type.
                            Example: 1 = single, 2 = double, 3 = triple, 4+ = suite/family room.
                          example: 2
                        room_type_id:
                          description: >
                            Real Simplotel room type ID. MUST be passed as-is in
                            lineItems.room_type_id when booking.
                          example: 118524
                        rate_plan_id:
                          type: string
                          description: >
                            Real Simplotel rate plan ID. MUST be passed as-is in
                            lineItems.rate_plan_id when booking.
                          example: "117575"
                        price_per_night_incl_taxes:
                          type: number
                          description: Average price per night including all taxes and fees.
                          example: 18878
                        grand_total_per_room_incl_taxes:
                          type: number
                          description: Total price for one room for the full stay including taxes.
                          example: 75510.56
                        rooms_required:
                          type: integer
                          description: Number of rooms needed.
                          example: 2
                        grand_total_all_rooms_incl_taxes:
                          type: number
                          description: Grand total for all rooms combined including taxes.
                          example: 151021.12
                        availability:
                          type: integer
                          description: Number of rooms of this type currently available.
                          example: 5
                        refundable:
                          type: boolean
                          description: >
                            Whether this rate plan allows free cancellation.
                            Use this to determine which payment options to offer the guest.
                            true = refundable, false = non-refundable.
                          example: true
                        payment_options:
                          type: array
                          description: >
                            Allowed payment flows for this rate plan per operational policy.

                            Possible values:
                            - "payment_link": Call /send-invoice with advanceAmount = grand_total_all_rooms_incl_taxes.
                              Room is held for 24 hours. Simplotel emails the guest a secure payment link.
                              This is the preferred default for all bookings.
                            - "send_quote": Call /send-quote.
                              Simplotel emails the guest a quote with a Book Now link to confirm later.
                              Only available for refundable rate plans.

                            Non-refundable rates return ["payment_link"] only — full payment required upfront.
                            Refundable rates return ["payment_link", "send_quote"].

                            When the guest is ready to pay → use payment_link.
                            When the guest is undecided → use send_quote.
                          items:
                            type: string
                            enum: [payment_link, send_quote]
                          example: ["payment_link", "send_quote"]
                        cancellation_policy:
                          type: string
                          example: "Free cancellation up to 48 hours prior to check-in."
                        inclusions:
                          type: array
                          items:
                            type: string
                          example: ["Buffet Breakfast", "Wi-Fi"]
                        detail_message:
                          type: string
                          description: >
                            Optional pre-formatted room detail text to help Tawk.to answer
                            follow-up requests for more information about a specific option.
                          example: "Room: Coral Azure (Room with Breakfast)\nElegant ocean-view room with king bed and breakfast included.\nIncludes: Buffet Breakfast, Wi-Fi\nCancellation: Free cancellation up to 48 hours prior to check-in."
                  independent_addons:
                    type: array
                    description: Optional add-ons available for this property (breakfast, airport transfer, etc.).
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: "42"
                        name:
                          type: string
                          example: "Airport Pickup"
                        price:
                          type: number
                          example: 1500
                        type:
                          type: string
                          enum: [per-night, one-time]
                          example: "one-time"
                        description:
                          type: string
                          example: "One-way private airport transfer."

  /book:
    post:
      summary: Confirm Booking (Internal Use)
      description: >
        Creates an instant confirmed booking with no payment collected upfront.
        NOTE: Per operational policy, prefer /send-invoice over /book.
        Use /send-invoice with advanceAmount > 0 to collect payment securely.
        This endpoint is retained for edge cases only.
      operationId: createBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sessionId
                - checkIn
                - checkOut
                - propertyId
                - quoteInfo
                - lineItems
              properties:
                sessionId:
                  type: string
                  description: REQUIRED. Same session ID used in /availability.
                  example: "chat_abc123"
                checkIn:
                  type: string
                  format: date
                  example: "2026-06-01"
                checkOut:
                  type: string
                  format: date
                  example: "2026-06-05"
                propertyId:
                  type: integer
                  description: Always 11184.
                  default: 11184
                  example: 11184
                advanceAmount:
                  type: number
                  description: Advance payment amount. Use 0 for pay-at-hotel.
                  default: 0
                  example: 0
                holdInventory:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    value:
                      type: integer
                      default: 24
                    unit:
                      type: string
                      default: "HOURS"
                quoteInfo:
                  type: object
                  required:
                    - checkInDate
                    - checkOutDate
                    - customerDetail
                  properties:
                    checkInDate:
                      type: string
                      format: date
                      example: "2026-06-01"
                    checkOutDate:
                      type: string
                      format: date
                      example: "2026-06-05"
                    customerDetail:
                      type: object
                      required:
                        - name
                        - email
                        - phone
                      properties:
                        name:
                          type: string
                          example: "John Doe"
                        email:
                          type: string
                          format: email
                          example: "john@example.com"
                        phone:
                          type: string
                          description: International format required.
                          example: "+919876543210"
                        bookingForSelf:
                          type: boolean
                          default: true
                    city:
                      type: string
                      example: "Mumbai"
                    state:
                      type: string
                      example: "Maharashtra"
                    country:
                      type: string
                      example: "India"
                    gstNumber:
                      type: string
                      example: ""
                lineItems:
                  type: array
                  description: >
                    One entry per room. Use option_number, or room_type_id + rate_plan_id
                    exactly as returned by /availability.
                  items:
                    type: object
                    required:
                      - adults
                      - children
                    properties:
                      option_number:
                        type: integer
                        description: >
                          PREFERRED. The option_number the guest selected from the
                          /availability response (e.g., 3).
                        example: 3
                      room_type_id:
                        description: Exact room_type_id from /availability.
                        example: 118524
                      rate_plan_id:
                        type: string
                        description: Exact rate_plan_id from /availability.
                        example: "117575"
                      adults:
                        type: integer
                        example: 2
                      children:
                        type: integer
                        example: 0
                      childAge:
                        type: array
                        items:
                          type: integer
                        example: []
                independent_addons:
                  type: array
                  description: Selected add-ons from the independent_addons list in /availability.
                  items:
                    type: object
      responses:
        "200":
          description: Booking confirmed. Guest will receive confirmation email from Simplotel.
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking_id:
                    type: string
                    description: Simplotel booking reference ID.
                    example: "KMDXCM"
                  quote_id:
                    type: string
                    example: "QMHIFV"
                  sessionId:
                    type: string
                    example: "chat_abc123"

  /send-invoice:
    post:
      summary: Send Invoice & Payment Link
      description: >
        Create a booking and send a payment invoice to the guest's email.
        Simplotel emails the guest a secure payment link and reservation details.
      operationId: sendInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sessionId
                - checkIn
                - checkOut
                - propertyId
                - quoteInfo
                - lineItems
              properties:
                sessionId:
                  type: string
                  description: REQUIRED. Same session ID used in /availability.
                  example: "chat_abc123"
                checkIn:
                  type: string
                  format: date
                  example: "2026-06-01"
                checkOut:
                  type: string
                  format: date
                  example: "2026-06-05"
                propertyId:
                  type: integer
                  default: 11184
                  example: 11184
                advanceAmount:
                  type: number
                  description: >
                    Amount to collect upfront.
                    For Pay Now (preferred): set to grand_total_all_rooms_incl_taxes.
                  example: 75510.56
                holdInventory:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    value:
                      type: integer
                      default: 24
                    unit:
                      type: string
                      default: "HOURS"
                quoteInfo:
                  type: object
                  required:
                    - checkInDate
                    - checkOutDate
                    - customerDetail
                  properties:
                    checkInDate:
                      type: string
                      format: date
                    checkOutDate:
                      type: string
                      format: date
                    customerDetail:
                      type: object
                      required:
                        - name
                        - email
                        - phone
                      properties:
                        name:
                          type: string
                          example: "John Doe"
                        email:
                          type: string
                          format: email
                          example: "john@example.com"
                        phone:
                          type: string
                          example: "+919876543210"
                        bookingForSelf:
                          type: boolean
                          default: true
                    city:
                      type: string
                    state:
                      type: string
                    country:
                      type: string
                    gstNumber:
                      type: string
                lineItems:
                  type: array
                  description: >
                    One entry per room. Use option_number, or room_type_id + rate_plan_id
                    exactly as returned by /availability.
                  items:
                    type: object
                    required:
                      - adults
                      - children
                    properties:
                      option_number:
                        type: integer
                        description: "PREFERRED. The option number chosen by the guest (e.g., 3)."
                        example: 3
                      room_type_id:
                        description: Real room_type_id from /availability.
                        example: 118524
                      rate_plan_id:
                        type: string
                        description: Real rate_plan_id from /availability.
                        example: "117575"
                      adults:
                        type: integer
                        example: 2
                      children:
                        type: integer
                        example: 0
                      childAge:
                        type: array
                        items:
                          type: integer
                        example: []
                independent_addons:
                  type: array
                  items:
                    type: object
      responses:
        "200":
          description: Invoice sent. Guest will receive payment link via email from Simplotel.
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking_id:
                    type: string
                    example: "KMDXCM"
                  quote_id:
                    type: string
                    example: "QMHIFV"
                  invoice_id:
                    type: string
                    example: "12345"
                  sessionId:
                    type: string
                    example: "chat_abc123"

  /send-quote:
    post:
      summary: Send Quote Email
      description: >
        Send a price quote to the guest's email.
      operationId: sendQuote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sessionId
                - check_in_date
                - check_out_date
                - room_selection
                - customer_detail
              properties:
                sessionId:
                  type: string
                  description: REQUIRED. Same session ID used in /availability.
                  example: "chat_abc123"
                check_in_date:
                  type: string
                  format: date
                  example: "2026-06-01"
                check_out_date:
                  type: string
                  format: date
                  example: "2026-06-05"
                propertyId:
                  type: integer
                  default: 11184
                  example: 11184
                customer_detail:
                  type: object
                  required:
                    - name
                    - email
                    - phone
                  properties:
                    name:
                      type: string
                      example: "John Doe"
                    email:
                      type: string
                      format: email
                      example: "john@example.com"
                    phone:
                      type: string
                      example: "+919876543210"
                room_selection:
                  type: array
                  description: >
                    One entry per room. Use option_number, or room_type_id + rate_plan_id
                    exactly as returned by /availability.
                  items:
                    type: object
                    required:
                      - adults
                      - children
                    properties:
                      option_number:
                        type: integer
                        description: "PREFERRED. The choice number selected by the guest (e.g., 3)."
                        example: 3
                      room_type_id:
                        description: Exact room_type_id from /availability.
                        example: 118524
                      rate_plan_id:
                        type: string
                        description: Exact rate_plan_id from /availability.
                        example: "117575"
                      adults:
                        type: integer
                        example: 2
                      children:
                        type: integer
                        example: 0
                      childAge:
                        type: array
                        items:
                          type: integer
                        example: []
      responses:
        "200":
          description: Quote sent. Guest will receive quote email from Simplotel.
          content:
            application/json:
              schema:
                type: object
                properties:
                  quote:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "NVUPX7"
                      status:
                        type: string
                        example: "PENDING"
                      expiry_time:
                        type: string
                        example: "2026-06-03T10:20:07Z"
                  sessionId:
                    type: string
                    example: "chat_abc123"

  /status/{action}:
    post:
      summary: Update Booking Status
      description: >
        Confirm, cancel, or extend a booking or quote.
        Use the booking_id, invoice_id, or quote_id returned from a previous call.
      operationId: updateStatus
      parameters:
        - in: path
          name: action
          required: true
          schema:
            type: string
            enum: [CONFIRMED, CANCELLED, EXTENDEXPIRY, EDIT]
          description: The lifecycle action to apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  description: The booking_id, invoice_id, or quote_id to update.
                  example: "KMDXCM"
                internal_comments:
                  type: string
                  example: "Cancelled by guest via chat"
                guest_comments:
                  type: string
                  example: "Change of plans"
                extend_hold_duration:
                  type: object
                  properties:
                    value:
                      type: integer
                      example: 24
                    unit:
                      type: string
                      example: "HOURS"
                send_email:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Status updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: "CANCELLED"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
